# Canonical caller — every knob lives in /hanzo.yml, none here.
# Runs on the git-runner fleet at git.hanzo.ai, the only pool serving these
# labels. github.com resolves only .github/workflows and has no runner for
# them, so a caller placed there is a gate that cannot be scheduled.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # A release dispatches this and hands it the document it shipped. With no
  # inputs the run re-reads the locked ref and writes nothing, so the projection
  # moves only by hand.
  workflow_dispatch:
    inputs:
      spec-ref:
        description: "cloud commit to move .spec-lock to. Empty = check the locked ref, write nothing."
        required: false
        default: ''
      spec-version:
        description: "Version to cut this projection at. Empty = derive the next patch."
        required: false
        default: ''
      spec-sha256:
        description: "Expected sha256 of openapi.yaml at that ref. Empty = do not verify."
        required: false
        default: ''
jobs:
  cicd:
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1
    with:
      spec-ref: ${{ github.event.inputs.spec-ref || '' }}
      spec-version: ${{ github.event.inputs.spec-version || '' }}
      spec-sha256: ${{ github.event.inputs.spec-sha256 || '' }}
    secrets: inherit
