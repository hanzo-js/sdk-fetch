# Canonical caller — every knob lives in /hanzo.yml, none here.
# Runs on the git-runner fleet at git.hanzo.ai, the only pool serving these
# labels. github.com resolves only .github/workflows and has no runner for
# them, so a caller placed there is a gate that cannot be scheduled.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # THE RELEASE POKES THE PROJECTION, and workflow_dispatch is how, because it
  # is the dispatch verb this forge HAS. Two shapes were tried and neither could
  # work: cloud posted `repository_dispatch: spec-update` at api.github.com,
  # where these callers ask for a label github.com has no runner for, so twelve
  # accepted events ran nothing; then this file grew a nightly `schedule:`,
  # which does move the projection but decides WHEN by a clock rather than by a
  # release, so a client is a day stale on average and nothing anywhere records
  # which release it is a projection of.
  #
  # Measured instead of assumed: POST /v1/repos/<o>/<r>/actions/workflows/
  # cicd.yml/dispatches on git.hanzo.ai answers 204, a git-runner picks the run
  # up in seconds, and it reaches its first step. So the release dispatches this
  # directly, on the side that has the runners, and the lane's no-payload path
  # takes cloud's NEWEST TAG — which exists only after that commit built, smoked
  # and rolled out. One trigger, fired by the thing that changed.
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1.0.54
    secrets: inherit
