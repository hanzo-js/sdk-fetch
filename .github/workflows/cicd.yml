# Canonical caller — every knob lives in /hanzo.yml, none here.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # hanzo-inc/cloud's release dispatches this with the commit and version it
  # shipped. With no inputs the run re-reads the locked ref and writes nothing.
  workflow_dispatch:
    inputs:
      spec-ref:
        description: "cloud commit to move .spec-lock to. Empty = check the locked ref, write nothing."
        required: false
        default: ''
      spec-version:
        description: "Version to cut this projection at. Empty = derive the next patch."
        required: false
        default: ''
      spec-sha256:
        description: "Expected sha256 of openapi.yaml at that ref. Empty = do not verify."
        required: false
        default: ''
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    # The reusable declares contents and packages write; the org default is read.
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      spec-ref: ${{ github.event.inputs.spec-ref || '' }}
      spec-version: ${{ github.event.inputs.spec-version || '' }}
      spec-sha256: ${{ github.event.inputs.spec-sha256 || '' }}
    secrets: inherit
